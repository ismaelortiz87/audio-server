<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Android prototype</title>
<!-- Tokens and components come from the real UI (console-ui), so these frames
     show the shipped phone layout inside Android chrome. Spec: docs/design/android.md (A2). -->
<link rel="stylesheet" href="../../../console-ui/src/styles/tokens.css">
<link rel="stylesheet" href="../../../console-ui/src/styles/base.css">
<link rel="stylesheet" href="../../../console-ui/src/styles/console.css">
<style>
/* Static design prototype, mock data. */
html, body { height: auto; min-height: 100%; background: #07090a; }
body { overflow: auto; }
.harness { position: fixed; right: 12px; bottom: 12px; z-index: 50; display: flex; gap: 8px; align-items: center;
  background: #000c; border: 1px dashed #555; border-radius: 8px; padding: 6px 8px; font-size: 12px; color: #bbb; }
.harness select { background: #1a1a1a; border: 1px solid #444; border-radius: 6px; color: #ddd; padding: 3px 6px; font-size: 12px; }
.stagewrap { display: flex; justify-content: center; padding: 20px 0 70px; }

/* phone frame + Android system bars (android.md §2: both bars are --rail) */
.phone { width: 390px; height: 844px; display: flex; flex-direction: column; border: 1px solid var(--line);
  border-radius: var(--radius-phoneFrame); overflow: hidden; background: var(--bg); position: relative; flex: none; }
.phone > .app { flex: 1; min-height: 0; height: auto; }
.sbar { height: 30px; flex: none; background: var(--rail); display: flex; align-items: center; padding: 0 18px 0 22px;
  font-size: 13px; font-weight: 600; color: var(--ink); gap: 6px; }
.sbar .si { width: 14px; height: 14px; color: var(--ink); }
.sbar .ni { width: 15px; height: 15px; color: var(--ink); }
.nbar { height: 22px; flex: none; background: var(--rail); display: grid; place-items: center; }
.nbar i { width: 108px; height: 4px; border-radius: 2px; background: var(--ink2); opacity: .8; }

/* activity strip stand-in (the real one is a canvas) */
.strip { position: relative; height: var(--size-activityHeightPhone); border-radius: 6px; background: var(--bg); overflow: hidden; }
.strip b { position: absolute; bottom: 50%; width: 3px; border-radius: 1px; transform: translateY(50%); }

/* settings problem rows (android.md §7) */
.prob { display: flex; gap: 10px; align-items: flex-start; background: var(--panel); border: 1px solid var(--line);
  border-left: 3px solid var(--warning); border-radius: var(--radius-control); padding: 10px 12px; color: var(--ink2); font-size: 13px; }
.prob .dot { margin-top: 6px; }
.prob > div { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.prob .btn { min-height: var(--size-touchMin); padding: 6px 14px; }
.mic[aria-disabled="true"] { cursor: default; opacity: .75; }

/* native error page (android.md §8) */
.native { flex: 1; background: var(--bg); padding: 0 24px; display: flex; flex-direction: column; }
.native .sp { flex: 0 0 24%; }
.native h1 { font-size: 20px; font-weight: 700; margin: 0 0 10px; color: var(--ink); line-height: 1.25; }
.native p { font-size: 15px; line-height: 1.45; color: var(--ink2); margin: 0 0 24px; }
.native .go { height: 48px; border-radius: 10px; background: var(--accent); color: var(--ink); border: 0; font-weight: 600; font-size: 15px; width: 100%; }

/* lock screen + notification. System UI is mocked in neutral greys (it isn't ours). */
.lock { flex: 1; background: radial-gradient(120% 70% at 30% 0%, #1d2327 0%, #0c0f11 60%); padding: 28px 14px 0; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.clock { text-align: center; color: #eef0f1; font-size: 72px; font-weight: 300; line-height: 1; letter-spacing: -.02em; }
.date { text-align: center; color: #c9cdd0; font-size: 14px; margin-bottom: 14px; }
.cap { color: #8a9094; font-size: 11px; text-transform: uppercase; letter-spacing: .09em; font-weight: 600; margin: 4px 6px -4px; }
.notif { background: #23282c; border-radius: 22px; padding: 12px 16px 6px; color: #eef0f1; }
.notif .nh { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #b9bec2; }
.notif .ic { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.notif .ic svg { width: 16px; height: 16px; }
.notif .nt { font-size: 15px; font-weight: 600; margin: 8px 0 2px 32px; line-height: 1.3; }
.notif .nx { font-size: 14px; color: #c3c8cb; margin: 0 0 4px 32px; }
.notif .na { display: flex; gap: 4px; margin-left: 22px; }
.notif .na span { font-size: 14px; font-weight: 600; color: #cfe3df; padding: 8px 10px; }

/* board: every screen side by side for review */
.board { display: flex; flex-wrap: wrap; gap: 28px 20px; padding: 20px; justify-content: center; }
.board figure { margin: 0; width: calc(390px * .62); height: calc(844px * .62 + 26px); }
.board figure .phone { transform: scale(.62); transform-origin: top left; }
.board figcaption { color: #9aa; font-size: 12px; margin-bottom: 6px; font-family: var(--mono); }
</style>
</head>
<body>
<div id="root"></div>
<div class="harness">Prototype · Android (A2)
  <select id="screen">
    <option value="board">Board: all screens</option>
    <option value="live">Live, all hear you</option>
    <option value="blocked">Microphone blocked</option>
    <option value="call">During a phone call</option>
    <option value="aftercall">After the call</option>
    <option value="echo">Phone speaker echo notice</option>
    <option value="settings">Settings · problems</option>
    <option value="notif">Lock screen · notification</option>
    <option value="error">Engine error page</option>
  </select>
</div>
<script>
const MIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const MIC_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 9.3V6a3 3 0 0 0-5.7-1.3M9 9v2a3 3 0 0 0 4.9 2.3M5 11a7 7 0 0 0 11.5 5.4M19 11a7 7 0 0 1-.4 2.3M12 18v3M3 3l18 18"/></svg>';
const GEAR = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';
// design/icon/crosspoint-notification.svg, inlined
const NOTIF_ICON = '<svg viewBox="0 0 24 24"><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M3 12 H6.4"/><path d="M12 17.6 V21"/></g><path fill="#fff" fill-rule="evenodd" d="M12 7.6 a4.4 4.4 0 1 0 0.001 0 Z M12 10.3 a1.7 1.7 0 1 1 -0.001 0 Z"/></svg>';

const STATIONS = [
  { name: 'VDI-ACCT-07', short: 'ACCT-07', color: 'var(--s1)', pan: -1, panTxt: 'L 100', lat: 32, seed: .37 },
  { name: 'VDI-DEV-02', short: 'DEV-02', color: 'var(--s2)', pan: 0, panTxt: 'Centre', lat: 41, seed: .91 },
  { name: 'VDI-QA-11', short: 'QA-11', color: 'var(--s3)', pan: 1, panTxt: 'R 100', lat: 28, seed: 1.7 },
];

const sbar = () => `<div class="sbar">9:41<span class="spacer"></span>
  <svg class="si" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20 2 8a15 15 0 0 1 20 0z"/></svg>
  <svg class="si" viewBox="0 0 24 24" fill="currentColor"><path d="M2 22h20V2z"/></svg>
  <svg class="si" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="3" width="10" height="19" rx="2"/></svg></div>`;
const nbar = () => '<div class="nbar"><i></i></div>';
const phone = inner => `<div class="phone">${sbar()}${inner}${nbar()}</div>`;

const topBar = () => `<header class="top"><span class="brand">Crosspoint</span>
  <span class="conn"><span class="dot good"></span>Connected</span><span class="spacer"></span>
  <button class="iconbtn" aria-label="Settings">${GEAR}</button></header>`;
const band = (live, text) => `<div class="liveband ${live ? '' : 'quiet'}" role="status"><span class="pill-live">LIVE</span><span>${text}</span></div>`;

const stage = live => `<section class="stage"><div class="stagehead"><span class="label">Placement</span><span class="spacer"></span>
  <div class="seg"><button>Spread</button><button>All centre</button></div></div>
  <div class="field"><div class="axis"></div>
    ${[0, 25, 50, 75, 100].map(p => `<div class="tick ${p === 50 ? 'c' : ''}" style="left:calc(var(--pad) + (100% - 2 * var(--pad)) * ${p / 100})"></div>`).join('')}
    <span class="end" style="left:0">L</span><span class="end" style="right:0">R</span>
    ${STATIONS.map(s => `<div class="puck ${live ? 'live' : ''}" style="left:calc(var(--pad) + (100% - 2 * var(--pad)) * ${(s.pan + 1) / 2});top:50%">
      <span class="swatch" style="background:${s.color}"></span>${s.short}<span class="mi">${MIC}</span></div>`).join('')}
  </div></section>`;

const strip = s => `<div class="strip">${Array.from({ length: 64 }, (_, i) =>
  `<b style="left:${i * 5.4 + 2}px;height:${4 + Math.abs(Math.sin(i * s.seed) * 18 + Math.sin(i * 1.3 + s.seed) * 6)}px;background:${s.color};opacity:.9"></b>`).join('')}</div>`;

const talkBtn = state => ({
  live: `<button class="tog talk" data-state="live">${MIC}Hears you</button>`,
  will: `<button class="tog talk" data-state="will">${MIC}Will hear you</button>`,
})[state];

const card = (s, talk) => `<article class="station">
  <div class="shead"><span class="swatch" style="background:${s.color}"></span><span class="sname">${s.name}</span><span class="badges"></span>
    <span class="health"><span class="dot good"></span>Clear <span class="num">${s.lat} ms</span></span></div>
  <div class="activity">${strip(s)}</div>
  <div class="row"><span class="label">Place</span><div class="pan">
    ${['L', '·', 'C', '·', 'R'].map((l, i) => `<button aria-checked="${i === (s.pan + 1) * 2}">${l}</button>`).join('')}
    <span class="thumb" style="left:calc(${(s.pan + 1) * 40}% + 3px)"></span></div><span class="val num">${s.panTxt}</span></div>
  <div class="row"><span class="label">Level</span><input type="range" min="-40" max="6" value="0" style="--p:87%"><span class="val num">0.0 dB</span></div>
  <div class="actions"><button class="tog mute">Mute</button><button class="tog solo">Solo</button>${talkBtn(talk)}</div>
</article>`;

const you = ({ state = 'idle', icon = MIC_OFF, label, sub, hot = false, targets, disabled = false, meter = 0 }) =>
  `<footer class="you"><button class="mic" data-state="${state}" ${disabled ? 'aria-disabled="true"' : ''}>${icon}<span>${label}<span class="sub">${sub}</span></span></button>
  <div class="meter micmeter ${hot ? 'hot' : ''}"><i style="width:${meter}%"></i></div>
  <div class="seg"><button aria-pressed="true">Open mic</button><button aria-pressed="false">Push to talk</button></div>
  <span class="targets">${targets}</span><span class="spacer"></span>
  <div class="master"><span class="label">Output</span><input type="range" min="-40" max="6" value="0" style="--p:87%"><span class="val num">0.0 dB</span></div></footer>`;

const consoleScreen = ({ live, bandText, notice = '', talk, youOpts, overlay = '' }) => phone(`<div class="app">${topBar()}${band(live, bandText)}
  <main>${notice}${stage(live)}<section class="stations">${STATIONS.map(s => card(s, talk)).join('')}</section></main>
  ${you(youOpts)}${overlay}</div>`);

const HOT = { state: 'hot', icon: MIC, label: 'Mic live', sub: 'Tap to turn off', hot: true, meter: 62, targets: 'Talking to <b>all stations</b>' };

const screens = {
  live: () => consoleScreen({ live: true, bandText: 'All 3 stations hear you', talk: 'live', youOpts: HOT }),
  blocked: () => consoleScreen({ live: false, bandText: 'Microphone blocked. You can listen, but no station hears you.', talk: 'will',
    youOpts: { label: 'Mic blocked', sub: 'Tap to allow', targets: 'Talking to <b>nobody</b>' } }),
  call: () => consoleScreen({ live: false, bandText: 'Mic off during your phone call.', talk: 'will',
    youOpts: { label: 'Mic off', sub: 'During your phone call', disabled: true, targets: 'Talking to <b>nobody</b>' } }),
  aftercall: () => consoleScreen({ live: false, bandText: 'Mic off since your phone call. Tap the mic button to talk again.', talk: 'will',
    youOpts: { label: 'Mic off', sub: 'Tap to open mic', targets: 'Talking to <b>nobody</b>', meter: 18 } }),
  echo: () => consoleScreen({ live: true, bandText: 'All 3 stations hear you', talk: 'live', youOpts: HOT,
    notice: '<div class="notice"><span class="dot"></span><div><b>Phone speaker:</b> stations may hear themselves through your mic. <em>Use headphones to talk.</em></div></div>' }),
  settings: () => consoleScreen({ live: false, bandText: 'Microphone blocked. You can listen, but no station hears you.', talk: 'will',
    youOpts: { label: 'Mic blocked', sub: 'Allow in Android settings', targets: 'Talking to <b>nobody</b>' },
    overlay: `<div class="scrim"></div><aside class="sheet" aria-label="Settings">
      <div class="head"><b>Settings</b><span class="spacer"></span><button class="iconbtn" aria-label="Close">✕</button></div>
      <div class="prob"><span class="dot warn"></span><div>Microphone blocked. Stations can't hear you.<button class="btn">Open Android settings</button></div></div>
      <div class="prob"><span class="dot warn"></span><div>Notifications are off, so you can't see whether your mic is live outside the app.<button class="btn">Open Android settings</button></div></div>
      <label class="field2"><span>Server</span><input value="aoo.sonobus.net:10998" disabled></label>
      <label class="field2"><span>Group</span><input value="ops" disabled><small>Password saved</small></label>
      <label class="field2"><span>Your name</span><input value="Pixel 8"></label>
      <label class="field2"><span>Microphone</span><select><option>Phone mic</option></select></label>
      <label class="field2"><span>Output</span><select><option>Phone speaker</option></select></label>
      <div class="field2"><span>Headset button</span><div class="seg" style="align-self:flex-start;padding:2px;border:1px solid var(--line)"><button aria-pressed="true">Mic on/off</button><button aria-pressed="false">Off</button></div><small>One press, in open-mic mode.</small></div>
      <label class="field2"><span>Solo dims others by</span><select><option>−18 dB</option></select></label>
      <details><summary>Advanced</summary></details>
      <button class="btn">Disconnect</button></aside>` }),
  notif: () => phone(`<div class="lock"><div class="clock num">9:41</div><div class="date">Sunday, 11 October</div>
    ${notif('Live: all 3 stations hear you', 'Listening to 3 of 3 stations · ops', ['Mic off', 'Disconnect'], 'var(--live)', 'open mic, live')}
    ${notif('Mic off · nobody hears you', 'Listening to 2 of 3 stations · ops', ['Mic on', 'Disconnect'], 'var(--accent)', 'open mic, off')}
    ${notif('Push to talk · nobody hears you', 'Reconnecting to ops…', ['Disconnect'], 'var(--accent)', 'push to talk, reconnecting')}
    ${notif('Mic off during your phone call', 'Listening to 3 of 3 stations · ops', ['Disconnect'], 'var(--accent)', 'phone call')}
  </div>`),
  error: () => phone(`<div class="native"><div class="sp"></div><h1>Crosspoint couldn't start</h1>
    <p>Its audio engine couldn't open its local connection (port 7070 is in use by another app). Close that app or restart the phone, then try again.</p>
    <button class="go">Try again</button></div>`),
};
function notif(title, text, actions, tint, caption) {
  return `<div class="cap">${caption}</div><div class="notif"><div class="nh"><span class="ic" style="background:${tint}">${NOTIF_ICON}</span>Crosspoint · now</div>
    <div class="nt">${title}</div><div class="nx">${text}</div><div class="na">${actions.map(a => `<span>${a}</span>`).join('')}</div></div>`;
}
screens.board = () => `<div class="board">${Object.keys(screens).filter(k => k !== 'board')
  .map(k => `<figure><figcaption>?screen=${k}</figcaption>${screens[k]()}</figure>`).join('')}</div>`;

const q = new URLSearchParams(location.search);
const sel = document.getElementById('screen');
sel.value = screens[q.get('screen')] ? q.get('screen') : 'board';
const render = () => {
  const k = sel.value;
  document.getElementById('root').innerHTML = k === 'board' ? screens.board() : `<div class="stagewrap">${screens[k]()}</div>`;
};
sel.onchange = () => { history.replaceState(null, '', `?screen=${sel.value}`); render(); };
render();
</script>
</body>
</html>
