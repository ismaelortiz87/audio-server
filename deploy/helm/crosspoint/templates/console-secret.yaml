{{- if .Values.console.enabled }}
{{- /*
The control API token: the container refuses to start without it and the
WS/origin check is useless without a real secret, so the chart only renders
this Secret when a token is provided — normally from secrets.yml
(`secrets.apiToken`, vault-encrypted) or an overlay
(`--set console.apiToken=...` / console.apiToken in values).
*/}}
{{- $token := .Values.console.apiToken }}
{{- if not $token }}
{{- with (index .Values "secrets") }}
{{- with .apiToken }}
{{- $token = . }}
{{- end }}
{{- end }}
{{- end }}
{{- if $token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "crosspoint.fullname" . }}-console-secret
  labels:
    {{- include "crosspoint.labels" . | nindent 4 }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    app.kubernetes.io/component: console
type: Opaque
stringData:
  api-token: {{ $token | quote }}
{{- end }}
{{- end }}
