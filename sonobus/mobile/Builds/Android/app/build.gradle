apply plugin: 'com.android.application'

def ndkVersionString = "25.2.9519653"

android {
    compileSdkVersion 33
    ndkVersion ndkVersionString
    namespace "io.lagreca.app.crosspoint"
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }
    signingConfigs {
        juceSigning {
            storeFile     file("${System.properties['user.home']}${File.separator}.android${File.separator}debug.keystore")
            storePassword "android"
            keyAlias      "androiddebugkey"
            keyPassword   "android"
            storeType     "jks"
        }
    }

    defaultConfig {
        applicationId "io.lagreca.app.crosspoint"
        minSdkVersion    24
        targetSdkVersion 33
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_TOOLCHAIN=clang", "-DANDROID_PLATFORM=android-24", "-DANDROID_STL=c++_static", "-DANDROID_CPP_FEATURES=exceptions rtti", "-DANDROID_ARM_MODE=arm", "-DANDROID_ARM_NEON=TRUE", "-DCMAKE_CXX_STANDARD=17", "-DCMAKE_CXX_EXTENSIONS=OFF"
            }
        }
    }

    buildTypes {
         debug {
             initWith debug
             debuggable    true
             jniDebuggable true
             signingConfig signingConfigs.juceSigning
         }
         release {
             initWith release
             debuggable    false
             jniDebuggable false
             signingConfig signingConfigs.juceSigning
         }
    }

    flavorDimensions "default"
    productFlavors {
        debug_ {
            ndk {
                abiFilters "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
            }
            externalNativeBuild {
                cmake {
                    cFlags    "-O0"
                    cppFlags  "-O0"
                    arguments "-DJUCE_BUILD_CONFIGURATION=DEBUG"
                }
            }

            dimension "default"
        }
        release_ {
            externalNativeBuild {
                cmake {
                    cFlags    "-O3"
                    cppFlags  "-O3"
                    arguments "-DJUCE_BUILD_CONFIGURATION=RELEASE"
                }
            }

            dimension "default"
        }
    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        if (names.contains ("debug_")
              && variant.buildType.name != "debug") {
            setIgnore(true)
        }
        if (names.contains ("release_")
              && variant.buildType.name != "release") {
            setIgnore(true)
        }
    }

    sourceSets {
        main.java.srcDirs +=
            ["../../../../Source/android/java",
             "../../../../../juce/modules/juce_core/native/javacore/init",
             "../../../../../juce/modules/juce_core/native/javacore/app",
             "../../../../../juce/modules/juce_gui_basics/native/javaopt/app"]

        main.res.srcDirs +=
            []
    }

    repositories {
        maven { url 'https://maven.google.com' }
    }

    dependencies {
        implementation 'androidx.appcompat:appcompat:1.0.2'
    }

// A3/A11: the upstream release keystore is not in the repo. The Projucer points every
// build type at signingConfigs.juceSigning, so debug is re-pointed at Gradle's own
// debug key and release at a keystore the builder supplies (never committed):
// env CROSSPOINT_KEYSTORE / _KEYSTORE_PASSWORD / _KEY_ALIAS / _KEY_PASSWORD, or the
// same as crosspointKeystore / crosspointKeystorePassword / crosspointKeyAlias /
// crosspointKeyPassword in ~/.gradle/gradle.properties. Release is arm64-v8a only.
    def cpSetting = { String env, String prop -> System.getenv(env) ?: (findProperty(prop) ?: '') }
    def cpKeystore = cpSetting('CROSSPOINT_KEYSTORE', 'crosspointKeystore')
    def cpStorePass = cpSetting('CROSSPOINT_KEYSTORE_PASSWORD', 'crosspointKeystorePassword')
    def cpKeyAlias = cpSetting('CROSSPOINT_KEY_ALIAS', 'crosspointKeyAlias')
    def cpKeyPass = cpSetting('CROSSPOINT_KEY_PASSWORD', 'crosspointKeyPassword') ?: cpStorePass
    signingConfigs {
        crosspointRelease {
            if (cpKeystore) {
                storeFile file(cpKeystore.replaceFirst('^~', System.properties['user.home']))
                storePassword cpStorePass
                keyAlias cpKeyAlias
                keyPassword cpKeyPass
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.crosspointRelease
        }
    }
    productFlavors {
        release_ {
            ndk {
                abiFilters "arm64-v8a"
            }
        }
    }
    gradle.taskGraph.whenReady { graph ->
        if (graph.allTasks.any { it.name.toLowerCase().contains('release_release') }
                && (!cpKeystore || !file(cpKeystore.replaceFirst('^~', System.properties['user.home'])).exists()
                    || !cpStorePass || !cpKeyAlias)) {
            throw new GradleException('Release build needs a signing keystore: set CROSSPOINT_KEYSTORE, CROSSPOINT_KEYSTORE_PASSWORD, CROSSPOINT_KEY_ALIAS (and optionally CROSSPOINT_KEY_PASSWORD), see docs/ANDROID.md')
        }
    }


}

