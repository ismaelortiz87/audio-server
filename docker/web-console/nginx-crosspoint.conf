# Reverse-proxy config for the Crosspoint web Console (P7.4 / D13).
#
# Drop this in as an nginx server block on the host that terminates TLS for
# crosspoint.app.lagreca.io, and point the two upstreams at wherever the
# Console container listens. TLS itself stays the proxy's job (D13): the
# container only ever serves plain HTTP.
#
#   cp nginx-crosspoint.conf /etc/nginx/sites-available/crosspoint
#   ln -s /etc/nginx/sites-available/crosspoint /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Replace UPSTREAM_HOST below with the host running the container:
#   127.0.0.1        - same host as nginx
#   10.248.233.7     - the VPN address of the container host (P7.4 used this)

upstream crosspoint_engine  { server UPSTREAM_HOST:7070; keepalive 16; }
upstream crosspoint_gateway { server UPSTREAM_HOST:8090; keepalive 8;  }

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crosspoint.app.lagreca.io;

    # Certificates are managed by the proxy's existing wildcard setup
    # (*.app.lagreca.io). Point these at whatever the other vhosts use.
    # ssl_certificate     /etc/letsencrypt/live/app.lagreca.io/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.lagreca.io/privkey.pem;

    # The engine can carry large state patches; keep the body limit generous.
    client_max_body_size 8m;

    # ---------------------------------------------------------------------
    # WebRTC signalling. MUST be on this same hostname: the UI fetches
    # `rtc/config` relative to its own origin (console-ui/src/lib/rtc.js), and
    # the gateway listens on 8090 separately from the UI on 7070. Publishing
    # 8090 on its own is NOT enough -- the page 404s and reports that audio is
    # unavailable. Plain HTTP, no upgrade needed.
    # ---------------------------------------------------------------------
    location /rtc/ {
        proxy_pass http://crosspoint_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # ---------------------------------------------------------------------
    # Control API + WebSocket. The `/api/v1/ws` upgrade MUST be forwarded or
    # the browser handshake fails (a plain HTTP proxy answers 502). Cookie
    # auth (P7.2) needs X-Forwarded-Proto: https so the session cookie is
    # marked Secure.
    # ---------------------------------------------------------------------
    location /api/ {
        proxy_pass http://crosspoint_engine;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Meter/state streams are long-lived; do not buffer or time them out.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The Console UI itself (and the PWA manifest/service worker).
    location / {
        proxy_pass http://crosspoint_engine;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# In the http {} block (not inside server {}) add, for the Connection header:
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
#
# ---------------------------------------------------------------------------
# NOT handled here: WebRTC media.
# ---------------------------------------------------------------------------
# Media is UDP and bypasses the proxy entirely (D13). The browser must be able
# to reach the container host directly on UDP 40000-40019:
#
#   * run the container with RTC_PUBLIC_IP=<the address the browser can reach>
#     (for the VPN setup: the host's wg0 address, e.g. 10.248.233.7), and
#   * open/forward UDP 40000-40019 to that host, and
#   * if the browser is off-VPN or behind a symmetric NAT, add a TURN server
#     (the gateway takes one; see docker/web-console/gateway/README.md).
#
# Also set CROSSPOINT_API_ORIGIN=https://crosspoint.app.lagreca.io on the
# container, so the engine's Origin check accepts browser requests from here.
