# SonoBus in the browser, with audio.
#
#   docker compose -f docker/docker-compose.yml up --build
#   open http://localhost:6080/            <- audio client
#   open http://localhost:6080/vnc.html    <- the app's own GUI
#
# The build context is the monorepo root because sonobus/CMakeLists.txt
# resolves ../juce and ../aoo.
services:
  sonobus:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: sonobus-web:latest
    ports:
      - "6080:6080"
    environment:
      # Virtual screen size; the browser view scales to fit.
      SCREEN_GEOMETRY: "1600x1000x24"
      BRIDGE_PORT: "6080"
    # Give the X server and the audio ring buffers room.
    shm_size: "256m"
    restart: unless-stopped

